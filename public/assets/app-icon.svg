<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Strix Prep app icon">
  <defs>
    <linearGradient id="bg" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#4D78FF"></stop>
      <stop offset="1" stop-color="#1638B8"></stop>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"></stop>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" in="SourceAlpha"></feGaussianBlur>
      <feOffset dy="1.5"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"></rect>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"></rect>

  <g filter="url(#ds)" transform="scale(2)">
    <path d="M18 18 L23 12 L26 20 Z" fill="#fff"></path>
    <path d="M46 18 L41 12 L38 20 Z" fill="#fff"></path>
    <circle cx="24" cy="30" r="10.5" fill="#fff"></circle>
    <circle cx="40" cy="30" r="10.5" fill="#fff"></circle>
    <circle cx="25" cy="31" r="4.6" fill="#1638B8"></circle>
    <circle cx="39" cy="31" r="4.6" fill="#1638B8"></circle>
    <path d="M32 34 L29 40 L35 40 Z" fill="#FFB020"></path>
    <path d="M24 44 Q32 52 40 44" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"></path>
  </g>
</svg>
