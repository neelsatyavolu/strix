
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Proctorly app icon">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4D78FF"></stop>
      <stop offset="1" stop-color="#1638B8"></stop>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"></stop>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" in="SourceAlpha"></feGaussianBlur>
      <feOffset dy="2"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"></rect>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"></rect>


  <g opacity="0.10" stroke="#FFFFFF" stroke-width="1">
    <line x1="20" y1="40" x2="108" y2="40"></line>
    <line x1="20" y1="60" x2="108" y2="60"></line>
    <line x1="20" y1="80" x2="108" y2="80"></line>
    <line x1="20" y1="100" x2="108" y2="100"></line>
  </g>


  <g filter="url(#dropShadow)">
    <path d="M 38 26&#xA;             L 76 26&#xA;             A 26 26 0 0 1 76 78&#xA;             L 56 78&#xA;             L 56 102&#xA;             L 38 102&#xA;             Z" fill="#FFFFFF"></path>

    <circle cx="66" cy="52" r="10" fill="url(#bg)"></circle>
  </g>

  <circle cx="92" cy="92" r="6.5" fill="#FFFFFF" opacity="0.95"></circle>
</svg>