<!-- @dsCard group="Proctorly App" viewport="1280x800" name="Proctorly — interactive UI kit" subtitle="Dashboard, practice, tutor, stats" -->
<!-- @startingPoint section="App" subtitle="Mac-native SAT practice app" viewport="1280x800" -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Proctorly — UI Kit</title>
  <link rel="icon" href="../../assets/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100vh; background: #DCDCE0; overflow: hidden; font-family: var(--font-sans); }
    [data-theme="dark"] body, body[data-theme="dark"] { background: #0E0E10; }
    /* macOS-y wallpaper */
    body {
      background-image:
        radial-gradient(circle at 20% 10%, rgba(46, 91, 255, 0.18), transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(255, 159, 10, 0.10), transparent 55%),
        linear-gradient(180deg, #D8DAE3 0%, #C7CAD5 100%);
    }
    [data-theme="dark"] body {
      background-image:
        radial-gradient(circle at 20% 10%, rgba(77, 120, 255, 0.20), transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(216, 114, 26, 0.10), transparent 55%),
        linear-gradient(180deg, #0F1117 0%, #050608 100%);
    }
    #window {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: min(1280px, calc(100vw - 32px));
      height: min(800px, calc(100vh - 32px));
    }
  </style>
</head>
<body>
  <div id="window"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}], throwOnError:false});"></script>

  <!-- App pieces (UMD, in order) -->
  <script src="./data.js"></script>
  <script type="text/babel" src="./panels/SessionStats.jsx"></script>
  <script type="text/babel" src="./panels/TutorPanel.jsx"></script>
  <script type="text/babel" src="./screens/Onboarding.jsx"></script>
  <script type="text/babel" src="./screens/Dashboard.jsx"></script>
  <script type="text/babel" src="./screens/PracticeSetup.jsx"></script>
  <script type="text/babel" src="./screens/QuestionRW.jsx"></script>
  <script type="text/babel" src="./screens/QuestionMath.jsx"></script>
  <script type="text/babel" src="./screens/ModuleReview.jsx"></script>
  <script type="text/babel" src="./screens/ScoreReport.jsx"></script>
  <script type="text/babel" src="./screens/Stats.jsx"></script>
  <script type="text/babel" src="./screens/TutorInvite.jsx"></script>
  <script type="text/babel" src="./screens/TutorChat.jsx"></script>
  <script type="text/babel" src="./screens/Settings.jsx"></script>
  <script type="text/babel" src="./App.jsx"></script>
  <script type="text/babel">
    // Wait for all babel-transpiled scripts to register globals, then mount.
    const ready = () => {
      if (!window.App || !window.Onboarding || !window.Dashboard || !window.PracticeSetup || !window.QuestionRW || !window.QuestionMath
          || !window.ModuleReview || !window.ScoreReport || !window.Stats
          || !window.TutorInvite || !window.TutorChat || !window.Settings
          || !window.TutorPanel || !window.SessionStats) {
        return setTimeout(ready, 50);
      }
      ReactDOM.createRoot(document.getElementById('window')).render(<App />);
      setTimeout(() => window.lucide && window.lucide.createIcons(), 100);
    };
    ready();
  </script>
</body>
</html>
